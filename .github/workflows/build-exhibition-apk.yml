name: Build Chat.com Exhibition APK
on:
  workflow_dispatch:
  push:
    branches: [review/chat-username-messaging]
    paths:
      - 'android/**'
      - '.github/workflows/build-exhibition-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-com-exhibition-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
