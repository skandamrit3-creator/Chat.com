<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087d67"><title>Chat.com</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f3;color:#18252b;font-family:system-ui,-apple-system,Arial}#app{height:100dvh;max-width:1000px;margin:auto;display:flex;background:white;overflow:hidden}.side{width:340px;border-right:1px solid #e3e9eb;display:flex;flex-direction:column}.brand{background:#087d67;color:white;padding:20px;font-size:24px;font-weight:800}.search{padding:14px}.search input{width:100%;padding:12px;border-radius:12px;border:0;background:#eef3f4}.list{overflow:auto;flex:1}.item{padding:15px;border-bottom:1px solid #f1f3f4;cursor:pointer}.item.active,.item:hover{background:#f0f7f5}.item small{display:block;color:#829096;margin-top:4px}.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f5f8f7}.head{background:#087d67;color:white;padding:16px;display:flex;gap:12px;align-items:center}.head b{flex:1}.head button{border:0;background:#ffffff22;color:white;padding:8px;border-radius:10px}.msgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:10px 12px;border-radius:15px;background:white;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#d7f4e5;border-bottom-right-radius:4px}.theirs{align-self:flex-start;border-bottom-left-radius:4px}.bubble img{max-width:240px;max-height:300px;border-radius:10px}.stamp{display:block;text-align:right;color:#7c8b90;font-size:10px;margin-top:4px}.composer{padding:12px;display:flex;gap:8px;background:white}.composer input{flex:1;min-width:0;padding:12px;border:0;background:#eef3f4;border-radius:24px}.btn{background:#087d67;color:white;border:0;border-radius:12px;padding:12px 15px;font-weight:700}.gate{margin:auto;width:min(420px,92%);padding:25px;background:white;border-radius:22px;box-shadow:0 10px 50px #0001}.gate h1{color:#087d67;margin:0}.gate input{width:100%;padding:13px;margin:8px 0;border:1px solid #dfe6e8;border-radius:12px}.gate button{width:100%;margin-top:10px}.switch{text-align:center;color:#087d67;padding:12px;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172a30;color:white;padding:12px;border-radius:12px;display:none}.toast.show{display:block}.hint{font-size:12px;color:#839196}@media(max-width:650px){.side{width:100%}.main{display:none}.side.hide{display:none}.main.open{display:flex;position:absolute;inset:0}.gate{padding:22px}}
</style></head><body><div id="app"><aside class="side" id="side"><div class="brand">Chat.com</div><div class="search"><input id="find" placeholder="Username to find…" onkeydown="if(event.key==='Enter')findUser()"><button class="btn" style="width:100%;margin-top:9px" onclick="findUser()">＋ Start chat</button></div><div id="contacts" class="list"></div></aside><main class="main" id="main"><div style="margin:auto;color:#829096;text-align:center">Find someone by username to start a chat.</div></main></div><div id="gate" style="position:fixed;inset:0;background:#edf2f3;display:none"><section class="gate"><h1>Chat.com</h1><p>Username and password. Then chat from anywhere.</p><input id="username" autocomplete="username" placeholder="Username (3–24 characters)"><input id="password" autocomplete="current-password" type="password" placeholder="Password (8+ characters)"><button class="btn" id="authBtn" onclick="authenticate()">Create account</button><div class="switch" id="switch" onclick="switchMode()">Already registered? Sign in</div><p class="hint">Prototype: messages are not end-to-end encrypted.</p></section></div><div class="toast" id="toast"></div><input id="image" type="file" accept="image/*" hidden onchange="uploadImage(this)"><script>
let token=localStorage.getItem('chat_token')||'',me='',current='',mode='register',pollTimer=null;
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function switchMode(){mode=mode==='register'?'login':'register';authBtn.textContent=mode==='register'?'Create account':'Sign in';switch.textContent=mode==='register'?'Already registered? Sign in':'New here? Create account'}
async function authenticate(){let username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!username||!password)return toast('Enter both fields');try{let d=await api('/api/v1/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});token=d.token;localStorage.setItem('chat_token',token);start()}catch(e){toast(e.message)}}
async function start(){try{let d=await api('/api/v1/me');me=d.username;gate.style.display='none';side.style.display='flex';loadContacts()}catch(e){token='';localStorage.removeItem('chat_token');gate.style.display='flex';side.style.display='none'}}
async function loadContacts(){try{let d=await api('/api/v1/contacts');let ns=d.users;if(current&&!ns.includes(current))ns.unshift(current);contacts.innerHTML=ns.map(n=>'<div class="item '+(current===n?'active':'')+'" onclick="openChat(\''+n+'\')"><b>@'+esc(n)+'</b><small>Open conversation</small></div>').join('')}catch(e){}}
async function findUser(){let n=find.value.trim().replace(/^@/,'').toLowerCase();if(!n)return toast('Type a username');try{let d=await api('/api/v1/users/'+encodeURIComponent(n));openChat(d.username)}catch(e){toast(e.message)}}
function openChat(n){current=n;side.classList.add('hide');main.classList.add('open');main.innerHTML='<div class="head"><button id="back" onclick="back()">←</button><b>@'+esc(n)+'</b><button onclick="logout()">Logout</button></div><div class="msgs" id="msgs"></div><div class="composer"><button class="btn" onclick="image.click()">📷</button><input id="txt" placeholder="Message…" onkeydown="if(event.key===\'Enter\')send()"><button class="btn" onclick="send()">Send</button></div>';loadContacts();refresh();clearInterval(pollTimer);pollTimer=setInterval(refresh,1500)}
function back(){current='';side.classList.remove('hide');main.classList.remove('open');clearInterval(pollTimer)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){if(!current)return;try{let d=await api('/api/v1/messages/'+encodeURIComponent(current));let e=document.getElementById('msgs');if(!e)return;let h=d.messages.map(m=>'<div class="bubble '+(m.sender===me?'mine':'theirs')+'">'+(m.media_data?'<img src="'+m.media_data+'">':'')+(m.text?'<div>'+esc(m.text)+'</div>':'')+'<span class="stamp">'+esc(m.sender)+' · '+new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div>').join('');if(e.dataset.html!==h){let bottom=e.scrollTop+e.clientHeight>=e.scrollHeight-60;e.innerHTML=h;e.dataset.html=h;if(bottom||!e.dataset.init)e.scrollTop=e.scrollHeight;e.dataset.init='1'}}catch(e){}}
async function send(){let v=txt.value.trim();if(!v)return;try{await api('/api/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:current,text:v})});txt.value='';refresh();loadContacts()}catch(e){toast(e.message)}}
async function uploadImage(input){let f=input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('Maximum image size is 5 MB');input.value='';return}let r=new FileReader();r.onload=async()=>{try{await api('/api/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:current,text:'',media_data:r.result,media_type:f.type})});refresh()}catch(e){toast(e.message)}input.value=''};r.readAsDataURL(f)}
async function logout(){try{await api('/api/v1/auth/logout',{method:'POST'})}catch(e){}token='';localStorage.removeItem('chat_token');current='';clearInterval(pollTimer);start()}
side.style.display='none';start();
</script></body></html>
