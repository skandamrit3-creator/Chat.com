<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><title>Chat.com</title>
<style>
:root{--ink:#172235;--muted:#7e8a9b;--accent:#5b71f2;--line:#e8edf4;--bg:#f4f6fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}#app{height:100dvh;max-width:1200px;margin:auto;display:flex;background:#fff;overflow:hidden;box-shadow:0 20px 70px #1b28401a}.side{width:350px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:white}.brand{padding:25px 23px 20px;display:flex;align-items:center;gap:12px}.logo{height:42px;width:42px;border-radius:14px;background:linear-gradient(135deg,#657bff,#8b57d8);display:grid;place-items:center;color:white;font-weight:900;font-size:22px;box-shadow:0 8px 18px #657bff40}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.search{padding:0 18px 17px}.search input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;outline:none;background:#f7f8fc}.search input:focus,.gate input:focus,.composer input:focus{border-color:#a8b5ff;box-shadow:0 0 0 3px #667bff15}.search .btn{width:100%;margin-top:10px}.list{overflow:auto;flex:1;padding:4px 10px}.listlabel{font-size:11px;font-weight:800;letter-spacing:1px;color:#9aa4b2;padding:13px 12px 8px;text-transform:uppercase}.item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;cursor:pointer;margin-bottom:3px}.item.active,.item:hover{background:#f2f4ff}.avatar{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#e6eaff,#d7defe);display:grid;place-items:center;color:#4d61d8;font-weight:800;flex-shrink:0}.itemtext{min-width:0;flex:1}.itemtext b{display:block;font-size:14px}.itemtext small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f8f9fd}.welcome{margin:auto;text-align:center;padding:35px;color:#758195}.welcome .biglogo{height:84px;width:84px;border-radius:28px;background:linear-gradient(135deg,#657bff,#8b57d8);color:white;display:grid;place-items:center;font-size:35px;font-weight:900;margin:0 auto 20px;box-shadow:0 14px 30px #657bff30}.welcome h2{color:var(--ink);margin:0 0 8px}.head{height:76px;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center}.head b{flex:1}.head small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.head button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:12px}.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px;background:radial-gradient(circle at 15% 10%,#eef1ff 0,transparent 30%),#f8f9fd}.bubble{max-width:min(78%,460px);padding:12px 14px;border-radius:18px;background:#fff;overflow-wrap:anywhere;box-shadow:0 3px 12px #17223508;line-height:1.45}.mine{align-self:flex-end;background:#657bff;color:white;border-bottom-right-radius:5px}.theirs{align-self:flex-start;border-bottom-left-radius:5px}.bubble img{display:block;max-width:min(100%,280px);max-height:340px;border-radius:12px;margin-bottom:4px}.stamp{display:block;text-align:right;opacity:.65;font-size:10px;margin-top:5px}.composer{padding:14px 18px;display:flex;gap:10px;background:white;border-top:1px solid var(--line);align-items:center}.composer input{flex:1;min-width:0;padding:13px 15px;border:1px solid var(--line);background:#f7f8fc;border-radius:25px;outline:none}.btn{background:var(--accent);color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:750;box-shadow:0 5px 13px #657bff30}.btn:hover{filter:brightness(.97)}.photo{background:#f1f3ff;color:#5367e7;border:0;border-radius:13px;padding:12px;font-size:18px}.gate{margin:auto;width:min(430px,92%);padding:30px;background:white;border-radius:24px;box-shadow:0 20px 60px #202e4b15}.gate h1{margin:0;color:var(--ink);font-size:28px}.gate p{color:var(--muted)}.gate input{width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:13px;outline:none}.gate button{width:100%;margin-top:12px}.switch{text-align:center;color:var(--accent);padding:15px;cursor:pointer;font-weight:650}.hint{font-size:12px;color:#9aa4b2}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172235;color:white;padding:13px 18px;border-radius:13px;display:none;z-index:5;box-shadow:0 10px 30px #0002}.toast.show{display:block}#gate{position:fixed;inset:0;background:#f4f6fb;display:none;z-index:4;padding:15px}.side.hide{display:none}.main.open{display:flex}@media(max-width:700px){#app{height:100dvh}.side{width:100%;border:0}.main{display:none}.main.open{display:flex;position:fixed;inset:0;z-index:2}.side.hide{display:none}.head{height:68px;padding:10px 14px}.msgs{padding:15px}.composer{padding:10px}.gate{padding:24px}.bubble{max-width:88%}}
</style></head><body><div id="app"><aside class="side" id="side"><div class="brand"><div class="logo">C</div><div><h1>Chat.com</h1><small>Simple. Personal. Connected.</small></div></div><div class="search"><input id="find" placeholder="Find someone by username…" onkeydown="if(event.key==='Enter')findUser()"><button class="btn" onclick="findUser()">＋ Start a conversation</button></div><div class="list" id="contacts"><div class="listlabel">Conversations</div></div></aside><main class="main" id="main"><div class="welcome"><div class="biglogo">C</div><h2>Your messages, together.</h2><p>Find someone by username and send a message or photo.</p></div></main></div>
<div id="gate"><section class="gate"><div class="logo">C</div><h1>Welcome to Chat.com</h1><p>Use your account to chat from any device.</p><input id="username" autocomplete="username" placeholder="Username (3–24 characters)"><input id="password" autocomplete="current-password" type="password" placeholder="Password (8+ characters)"><button class="btn" id="authBtn" onclick="authenticate()">Create account</button><div class="switch" id="switch" onclick="switchMode()">Already registered? Sign in</div><p class="hint">Use a unique password. Messages are not end-to-end encrypted.</p></section></div><div class="toast" id="toast"></div><input id="image" type="file" accept="image/*" hidden onchange="uploadImage(this)">
<script>
let token=localStorage.getItem('chat_token')||'',me='',current='',mode='register',pollTimer=null;
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function switchMode(){mode=mode==='register'?'login':'register';document.getElementById('authBtn').textContent=mode==='register'?'Create account':'Sign in';document.getElementById('switch').textContent=mode==='register'?'Already registered? Sign in':'New here? Create account'}
async function authenticate(){let username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!username||!password)return toast('Enter both fields');try{let d=await api('/api/v1/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});token=d.token;localStorage.setItem('chat_token',token);start()}catch(e){toast(e.message)}}
async function start(){try{let d=await api('/api/v1/me');me=d.username;document.getElementById('gate').style.display='none';document.getElementById('side').style.display='flex';loadContacts()}catch(e){token='';localStorage.removeItem('chat_token');document.getElementById('gate').style.display='flex';document.getElementById('side').style.display='none'}}
async function loadContacts(){try{let d=await api('/api/v1/contacts');let ns=d.users;if(current&&!ns.includes(current))ns.unshift(current);let e=document.getElementById('contacts');e.innerHTML='<div class="listlabel">Conversations</div>'+ns.map(n=>'<div class="item '+(current===n?'active':'')+'" onclick="openChat(\''+n+'\')"><div class="avatar">'+esc(n.slice(0,1).toUpperCase())+'</div><div class="itemtext"><b>@'+esc(n)+'</b><small>Tap to open conversation</small></div></div>').join('')+(ns.length?'':'<div style="padding:12px;color:#98a1b1;font-size:13px">No conversations yet. Find someone above.</div>')}catch(e){}}
async function findUser(){let n=document.getElementById('find').value.trim().replace(/^@/,'').toLowerCase();if(!n)return toast('Type a username');try{let d=await api('/api/v1/users/'+encodeURIComponent(n));openChat(d.username)}catch(e){toast(e.message)}}
function openChat(n){current=n;document.getElementById('side').classList.add('hide');let m=document.getElementById('main');m.classList.add('open');m.innerHTML='<div class="head"><button onclick="back()">←</button><div class="avatar">'+esc(n.slice(0,1).toUpperCase())+'</div><div style="flex:1"><b>@'+esc(n)+'</b><small>Chat conversation</small></div><button onclick="logout()">Sign out</button></div><div class="msgs" id="msgs"></div><div class="composer"><button class="photo" title="Send photo" onclick="document.getElementById(\'image\').click()">＋</button><input id="txt" placeholder="Write a message…" onkeydown="if(event.key===\'Enter\')send()"><button class="btn" onclick="send()">Send</button></div>';loadContacts();refresh();clearInterval(pollTimer);pollTimer=setInterval(refresh,1800)}
function back(){current='';document.getElementById('side').classList.remove('hide');document.getElementById('main').classList.remove('open');clearInterval(pollTimer)}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){if(!current)return;try{let d=await api('/api/v1/messages/'+encodeURIComponent(current));let e=document.getElementById('msgs');if(!e)return;let h=d.messages.map(m=>'<div class="bubble '+(m.sender===me?'mine':'theirs')+'">'+(m.media_data?'<img src="'+m.media_data+'" alt="Shared photo">':'')+(m.text?'<div>'+esc(m.text)+'</div>':'')+'<span class="stamp">'+esc(m.sender)+' · '+new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div>').join('');if(e.dataset.html!==h){let bottom=e.scrollTop+e.clientHeight>=e.scrollHeight-60;e.innerHTML=h;e.dataset.html=h;if(bottom||!e.dataset.init)e.scrollTop=e.scrollHeight;e.dataset.init='1'}}catch(e){}}
async function send(){let input=document.getElementById('txt'),v=input.value.trim();if(!v)return;try{await api('/api/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:current,text:v})});input.value='';refresh();loadContacts()}catch(e){toast(e.message)}}
async function uploadImage(input){let f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Choose an image file');input.value='';return}if(f.size>5*1024*1024){toast('Maximum image size is 5 MB');input.value='';return}let r=new FileReader();r.onload=async()=>{try{await api('/api/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:current,text:'',media_data:r.result,media_type:f.type})});refresh()}catch(e){toast(e.message)}input.value=''};r.readAsDataURL(f)}
async function logout(){try{await api('/api/v1/auth/logout',{method:'POST'})}catch(e){}token='';localStorage.removeItem('chat_token');current='';clearInterval(pollTimer);start()}
document.getElementById('side').style.display='none';start();
</script></body></html>
